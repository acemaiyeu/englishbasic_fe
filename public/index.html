<script>
  init = () => {
    if(getDarkMode()){
        document.getElementById("root").classList.add("dark-mode");
    }
    let font_size_master = getSettingByTitle("Font size");
    document.getElementById("html-default").style.fontSize = font_size_master;
  }
  // Prevent closing from click inside dropdown
  getSettings = () => {
    let data = JSON.parse(localStorage.getItem("settings")) ?? [];

    if(data?.length > 0){
        return data;
    }else{
        setSettingDefault();
        data = JSON.parse(localStorage.getItem("settings")) ?? [];
        return data;
    }
}
 getDarkMode = () => {
    let settings = getSettings();
    let darkModeSetting = settings[0].data.find(item => item.title_english === "Dark mode");
    return darkModeSetting ? darkModeSetting.status : false;
}
getSettingByTitle = (title) => {
    let settings = getSettings();
    let darkModeSetting = settings[0].data.find(item => item.title_english.toLowerCase() === title.toLowerCase());
    return darkModeSetting ? darkModeSetting.value : "14px";
}
init()
</script>
